services:
  app:
    environment:
      NAS_AI_INFERENCE_BACKEND: cuda
      NAS_AI_SCAN_ROOTS: /library,/video-library
      NAS_AI_MUTATION_ROOTS: /library=/maintenance/library,/video-library=/maintenance/video-library
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ${NAS_VIDEO_PATH:-./video-library}:/video-library:ro
      - ${NAS_VIDEO_PATH:-./video-library}:/maintenance/video-library
    gpus: all

  vision:
    environment:
      LD_LIBRARY_PATH: /opt/llama:/opt/cuda/lib
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${NAS_LLAMA_RUNTIME_PATH:-./runtime/llama-cuda}:/opt/llama:ro
      - ${NAS_CUDA_LIB_PATH:-/usr/local/cuda-12.8/targets/x86_64-linux/lib}:/opt/cuda/lib:ro
    gpus: all

  embedding:
    command:
      - --model
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --alias
      - qwen3-embedding:0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "${NAS_AI_EMBEDDING_PARALLEL:-1}"
      - --ctx-size
      - "${NAS_AI_EMBEDDING_CTX_SIZE:-2048}"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --batch-size
      - "${NAS_AI_EMBEDDING_BATCH_SIZE:-128}"
      - --ubatch-size
      - "${NAS_AI_EMBEDDING_UBATCH_SIZE:-64}"
      - --threads
      - "6"
      - --threads-batch
      - "8"
      - --embedding
      - --pooling
      - last
      - --n-gpu-layers
      - "${NAS_AI_EMBEDDING_GPU_LAYERS:-99}"
    environment:
      LD_LIBRARY_PATH: /opt/llama:/opt/cuda/lib
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${NAS_LLAMA_RUNTIME_PATH:-./runtime/llama-cuda}:/opt/llama:ro
      - ${NAS_CUDA_LIB_PATH:-/usr/local/cuda-12.8/targets/x86_64-linux/lib}:/opt/cuda/lib:ro
    gpus: all

  speech:
    environment:
      HF_HUB_CACHE: /root/.cache/huggingface
      LD_LIBRARY_PATH: /opt/cuda/lib
      SPEECH_DEVICE: cuda
      SPEECH_COMPUTE_TYPE: float16
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${NAS_CUDA_LIB_PATH:-/usr/local/cuda-12.8/targets/x86_64-linux/lib}:/opt/cuda/lib:ro
    gpus: all
