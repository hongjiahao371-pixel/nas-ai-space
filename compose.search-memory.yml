# Opt-in for small libraries on hosts with sufficient RAM. Run the verified
# vector-memory.py migration for existing collections; changing env alone only
# affects newly created collections. The optional helper pins allocated search
# pages read-only; it does not change backup CPU or IO priority.
services:
  app:
    # Keep API workers and pooled read pages out of disk-backed swap.
    memswap_limit: ${NAS_AI_APP_MEM_LIMIT:-1536m}
    environment:
      NAS_AI_VECTORS_ON_DISK: "false"
  qdrant:
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "false"
    mem_limit: ${NAS_AI_QUERY_MEMORY_LIMIT:-1g}
    memswap_limit: ${NAS_AI_QUERY_MEMORY_LIMIT:-1g}

  qdrant-memory:
    image: ${NAS_AI_SEARCH_MEMORY_IMAGE:-${NAS_AI_APP_IMAGE:-ghcr.io/hongjiahao371-pixel/nas-ai-space:1.7.3}}
    restart: unless-stopped
    entrypoint: ["python", "/usr/local/bin/nas-ai-pin-search-pages.py"]
    command: ["--budget-mb", "384"]
    user: "0:0"
    volumes: ["qdrant-data:/qdrant/storage:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    network_mode: none
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.25
    ulimits:
      memlock: {soft: 402653184, hard: 402653184}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/tmp/residency.json')); assert s['ready'] and time.time()-s['checked_at']<60"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  database-memory:
    image: ${NAS_AI_DATABASE_MEMORY_IMAGE:-${NAS_AI_APP_IMAGE:-ghcr.io/hongjiahao371-pixel/nas-ai-space:1.7.3}}
    restart: unless-stopped
    entrypoint: ["python", "/usr/local/bin/nas-ai-pin-search-pages.py"]
    command: ["--sqlite-only", "--sqlite", "/data/nas-ai-space.db", "--budget-mb", "128"]
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    volumes: ["${NAS_AI_DATA_PATH:-./data}:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    network_mode: none
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.1
    ulimits:
      memlock: {soft: 134217728, hard: 134217728}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/tmp/residency.json')); assert s['ready'] and time.time()-s['checked_at']<60"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  qdrant-code-memory:
    image: ${NAS_AI_CODE_MEMORY_IMAGE:-${NAS_AI_APP_IMAGE:-ghcr.io/hongjiahao371-pixel/nas-ai-space:1.7.3}}
    restart: unless-stopped
    entrypoint: ["python", "/usr/local/bin/nas-ai-pin-runtime-code.py"]
    command: ["--budget-mb", "96"]
    pid: "service:qdrant"
    depends_on:
      qdrant:
        condition: service_healthy
        restart: true
    user: "0:0"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["SYS_PTRACE", "CHECKPOINT_RESTORE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.1
    ulimits:
      memlock: {soft: 100663296, hard: 100663296}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/tmp/runtime-residency.json')); assert s['ready'] and time.time()-s['checked_at']<60"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
