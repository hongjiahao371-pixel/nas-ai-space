name: Native container runtime

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: ''

jobs:
  native:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build native application
        id: tested-app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nas-ai-space:test
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max
      - name: Build native media runtime
        id: tested-media
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/multimodal-runtime.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nas-ai-space:test-media
          cache-from: type=gha,scope=media-${{ matrix.arch }}
          cache-to: type=gha,scope=media-${{ matrix.arch }},mode=max
      - name: Run full suite in native application image
        run: docker run --rm --entrypoint python -v "$PWD:/src:ro" -w /src nas-ai-space:test -m unittest discover -s tests -v
      - name: Exercise real CPU model and application
        run: python3 scripts/test-container-runtime.py
      - name: Exercise default Qwen models on CPU
        run: python3 scripts/test-ollama-runtime.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ matrix.arch }}
          path: |
            runtime-evidence/
            ollama-runtime-evidence/
          if-no-files-found: warn
      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested application by digest
        if: inputs.publish
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
      - name: Publish tested media runtime by digest
        if: inputs.publish
        id: media
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/multimodal-runtime.Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=media-${{ matrix.arch }}
      - name: Confirm published images are exactly the tested builds
        if: inputs.publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PLATFORM: linux/${{ matrix.arch }}
          TESTED_APP: ${{ steps.tested-app.outputs.imageid }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          TESTED_MEDIA: ${{ steps.tested-media.outputs.imageid }}
          MEDIA_DIGEST: ${{ steps.media.outputs.digest }}
        run: |
          set -euo pipefail
          # Registry exports include an OCI index with provenance. Compare the
          # pulled platform image's config ID with the image actually tested,
          # never the index digest with a local Docker image ID.
          docker pull --platform "$PLATFORM" "$IMAGE@$APP_DIGEST"
          docker pull --platform "$PLATFORM" "$IMAGE@$MEDIA_DIGEST"
          published_app=$(docker image inspect --format '{{.Id}}' "$IMAGE@$APP_DIGEST")
          published_media=$(docker image inspect --format '{{.Id}}' "$IMAGE@$MEDIA_DIGEST")
          test -n "$TESTED_APP" && test "$TESTED_APP" = "$published_app"
          test -n "$TESTED_MEDIA" && test "$TESTED_MEDIA" = "$published_media"
      - name: Save image digests
        if: inputs.publish
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MEDIA_DIGEST: ${{ steps.media.outputs.digest }}
        run: |
          mkdir -p digests/app digests/media
          touch "digests/app/${APP_DIGEST#sha256:}"
          touch "digests/media/${MEDIA_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 7
