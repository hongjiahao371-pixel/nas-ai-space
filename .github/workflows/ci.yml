name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Verify Python environment
        run: python -m pip check
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Verify static assets and scripts
        run: |
          node --check app/static/app.js
          bash -n scripts/nas-ai scripts/*.sh
          git diff --check
          scripts/release-check.sh
      - name: Validate Compose profiles
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f compose.intel.yml config --quiet
          docker compose -f docker-compose.yml -f compose.intel-openvino.yml config --quiet
          docker compose -f docker-compose.yml -f compose.amd.yml config --quiet
          docker compose -f docker-compose.yml -f compose.amd-vulkan.yml config --quiet
          docker compose -f docker-compose.yml -f compose.nvidia.yml config --quiet
          docker compose -f compose.nas-intel.yml config --quiet
          docker compose -f compose.nas-intel.yml -f compose.nas-nvidia.yml config --quiet
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock.txt --progress-spinner off
