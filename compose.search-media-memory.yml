# Add after the media and search-memory profiles. Original volumes are unchanged.
services:
  multimodal-code-memory:
    image: ${NAS_AI_CODE_MEMORY_IMAGE:-${NAS_AI_APP_IMAGE:-ghcr.io/hongjiahao371-pixel/nas-ai-space:1.7.3}}
    restart: unless-stopped
    entrypoint: ["python", "/usr/local/bin/nas-ai-pin-runtime-code.py"]
    command: ["--budget-mb", "64"]
    pid: "service:multimodal-query"
    depends_on:
      multimodal-query:
        condition: service_healthy
        restart: true
    user: "0:0"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["SYS_PTRACE", "CHECKPOINT_RESTORE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    ulimits:
      memlock: {soft: 67108864, hard: 67108864}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/tmp/runtime-residency.json')); assert s['ready'] and time.time()-s['checked_at']<60"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
