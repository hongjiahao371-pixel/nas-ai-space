<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页摘录</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>网页摘录</h1>
<p>先在网页选中文字，再点下面的按钮。不读取整页或表单。</p>
<button id="read" type="button">读取当前页选中文字</button>
<section id="preview" hidden>
<label>标题<input id="title" maxlength="600"></label>
<label>来源网址<input id="url" type="url" maxlength="2048"></label>
<p>会去掉查询参数和片段，路径仍可能包含私人信息。导出前请检查来源与正文。</p>
<label>摘录<textarea id="text" maxlength="200000" rows="8"></textarea></label>
<button id="save" type="button">保存到本地</button>
<p>保存后，到 NAS AI Space 的目标项目入库箱，选择这份文件并确认导入。</p>
</section>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="popup.mjs"></script>
</body>
</html>
